site_name: graphnetz
site_description: >-
  A large-scale database and benchmark for graph learning: statistically
  rigorous GNN benchmarking whose default output is a statistical report,
  not a leaderboard.
site_author: Kleyton da Costa
site_url: https://kleyt0n.github.io/graphnetz/
repo_name: Kleyt0n/graphnetz
repo_url: https://github.com/Kleyt0n/graphnetz
edit_uri: edit/main/docs/
copyright: MIT License

docs_dir: docs

theme:
  name: material
  # Single-ink mark: the header is the brand blue in both schemes, where the
  # two-tone mark's blue node would vanish.
  logo: logo.svg
  favicon: favicon.png
  icon:
    repo: fontawesome/brands/github
  # Roboto is loaded by stylesheets/extra.css as a variable font, so the
  # 500/600/650 weights used for headings and nav render as cut rather than
  # snapping to the 400/700 pair Material requests by default.
  font: false
  palette:
    # primary/accent are `custom`, defined in stylesheets/extra.css around the
    # brand blue #8da9c4. Spelled out on every entry: Material renders the
    # FIRST entry's palette server-side, so all three must agree or a cold load
    # flashes Material's indigo before settling on the blue.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    # Section landing pages: `concepts/index.md` etc. become the clickable
    # section itself rather than a stray "Overview" child.
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    # Left sidebar: top-level groups collapse, and only the one holding the
    # current page opens, so the whole site fits one screen of navigation.
    # Breadcrumbs above the title say where a page sits in that tree.
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kleyt0n/graphnetz
      name: graphnetz on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/graphnetz/
      name: graphnetz on PyPI
  generator: false

# Sources that live next to the docs but should not be published: the figure
# generator is run by hand and its output is committed beside it.
exclude_docs: |
  img/_gen_cd_figures.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            filters: ["!^_"]
            heading_level: 3
            inherited_members: false
            line_length: 88
            members_order: source
            merge_init_into_class: true
            parameter_headings: false
            separate_signature: true
            show_bases: true
            show_if_no_docstring: false
            show_labels: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            unwrap_annotated: true
            summary:
              attributes: true
              functions: true
              modules: false
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Conventions: getting-started/conventions.md
  - Concepts:
      - concepts/index.md
      - Tasks and metrics: concepts/tasks.md
      - Uncertainty: concepts/uncertainty.md
      - Comparison: concepts/comparison.md
      - Adequacy: concepts/adequacy.md
      - Reproducibility: concepts/reproducibility.md
  - Models:
      - models/index.md
      - GCN: models/gcn.md
      - GAT: models/gat.md
      - GIN: models/gin.md
      - GraphSAGE: models/graphsage.md
      - GraphTransformer: models/graph-transformer.md
      - DGI: models/dgi.md
      - Adapters: models/adapters.md
  - Guides:
      - Benchmark protocol: guides/benchmark.md
      - Datasets: guides/datasets.md
      - Reading the report: guides/report.md
      - Hyperparameter search: guides/search.md
      - Figures and tables: guides/figures.md
  - Extending:
      - Custom models: guides/custom-models.md
      - Custom datasets: guides/custom-datasets.md
  - Findings: findings.md
  - API reference:
      - reference/index.md
      - graphnetz.benchmark: reference/benchmark.md
      - graphnetz.datasets: reference/datasets.md
      - graphnetz.models: reference/models.md
      - graphnetz.training: reference/training.md
      - graphnetz.plotting: reference/plotting.md
  - Contributing: guides/contributing.md
